<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaundryKu - Register</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-wrapper">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>
        
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <div class="logo">
                        <div class="logo-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12,2A10,10 0 1,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6C13.66,6 15,7.34 15,9C15,10.66 13.66,12 12,12C10.34,12 9,10.66 9,9C9,7.34 10.34,6 12,6M12,14C14.97,14 17.39,15.55 18.66,17.82L15.33,19.69C14.67,18.53 13.44,17.75 12,17.75C10.56,17.75 9.33,18.53 8.67,19.69L5.33,17.82C6.61,15.55 9.03,14 12,14M12,16C10.06,16 8.5,17.06 8.5,18.5H15.5C15.5,17.06 13.94,16 12,16Z" />
                            </svg>
                        </div>
                        <span class="logo-text">LaundryQu</span>
                    </div>
                    <h2 class="welcome-text">Buat Akun Baru</h2>
                    <p class="subtitle-text">Daftar untuk mengelola laundry Anda</p>
                </div>
                
                <form class="login-form" id="registerForm">
                    <div class="input-group">
                        <label for="name">Nama Lengkap</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M12,12C14.76,12 17,9.76 17,7C17,4.24 14.76,2 12,2C9.24,2 7,4.24 7,7C7,9.76 9.24,12 12,12M12,14C9.33,14 4,15.34 4,18V20H20V18C20,15.34 14.67,14 12,14Z" />
                            </svg>
                            <input type="text" id="name" name="name" placeholder="Nama Lengkap" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="regEmail">Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M12,5A7,7 0 0,1 19,12A7,7 0 0,1 12,19A7,7 0 0,1 5,12A7,7 0 0,1 12,5M12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17A5,5 0 0,0 17,12A5,5 0 0,0 12,7Z" />
                            </svg>
                            <input type="email" id="regEmail" name="regEmail" placeholder="Email" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="regPassword">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10A2,2 0 0,1 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z" />
                            </svg>
                            <input type="password" id="regPassword" name="regPassword" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" id="toggleRegPassword">
                                <svg class="eye-icon" viewBox="0 0 24 24">
                                    <path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-btn" id="registerBtn">
                        <span class="btn-text">Daftar</span>
                        <div class="btn-spinner"></div>
                    </button>
                </form>
                
                <p class="signup-text">
                    Sudah punya akun? <a href="index.html" class="signup-link">Masuk sekarang</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="register.js"></script>
</body>
</html>
